spring:
  application:
    name: brokerage-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    read:
      strict-duplicate-detection: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        globally_quoted_identifiers: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/brokerage}
    username: ${SPRING_DATASOURCE_USERNAME:brokerage}
    password: ${SPRING_DATASOURCE_PASSWORD:brokerage}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}

brokerage:
  api:
    base-path: /api/brokerage-api
  money:
    scale: ${BROKERAGE_MONEY_SCALE:2}
    min-amount: ${BROKERAGE_MONEY_MIN_AMOUNT:0}
    max-amount: ${BROKERAGE_MONEY_MAX_AMOUNT:99999999.99}
    min-shares: ${BROKERAGE_MONEY_MIN_SHARES:1}
    max-shares: ${BROKERAGE_MONEY_MAX_SHARES:2147483647}
